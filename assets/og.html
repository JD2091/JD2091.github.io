<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>OG card</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#14181C; --ink:#ECEEEF; --ink-soft:#9AA3AA;
    --rule:#2C3238; --signal:#FF7A45;
    --sans:"Archivo","Liberation Sans","Helvetica Neue",Arial,sans-serif;
    --mono:"IBM Plex Mono","DejaVu Sans Mono",Consolas,monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:1200px;height:630px}
  body{background:var(--paper);color:var(--ink);font-family:var(--sans);overflow:hidden}

  .card{position:relative;width:1200px;height:630px;display:grid;
        grid-template-columns:1fr 320px;align-items:center;
        gap:48px;padding:64px 72px}
  .card::before{content:"";position:absolute;inset:0 0 auto 0;height:8px;background:var(--signal)}

  .kicker{font-family:var(--mono);font-weight:500;font-size:17px;line-height:1.5;
          letter-spacing:.07em;text-transform:uppercase;color:var(--signal);
          margin-bottom:30px}
  .head{font-size:58px;font-weight:700;line-height:1.06;letter-spacing:-0.035em}
  .bar{width:72px;height:4px;background:var(--signal);margin:34px 0 24px}
  .name{font-size:27px;font-weight:700;letter-spacing:-0.02em}
  .role{font-size:20px;font-weight:600;color:var(--ink-soft);margin-top:6px}

  .shot{width:320px;height:320px;border-radius:50%;object-fit:cover;
        object-position:50% 22%;justify-self:end;
        border:5px solid var(--signal)}
</style>
</head>
<body>
  <div class="card">
    <div>
      <p class="kicker">Technical account ownership / Agentic automation / Enterprise adoption</p>
      <h1 class="head">I advise enterprises on what I&rsquo;ve shipped.</h1>
      <div class="bar"></div>
      <p class="name">Jeet V. Doshi</p>
      <p class="role">Technical Account Manager &middot; WonderBotz</p>
    </div>
    <img class="shot" src="imgs/Jeet Profile pic.jpeg" alt="">
  </div>
</body>
</html>
