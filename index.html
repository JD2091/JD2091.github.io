<!DOCTYPE html>
<!--
  Reuse guide:
  - This file owns document structure, accessibility landmarks, and metadata.
  - All visible content and chrome comes from assets/data.js, rendered by
    assets/app.js. The body below is an empty skeleton.
  - PROFILE.sections drives which sections exist, their order, their headings,
    and the rail navigation.
  - When cloning the site, edit assets/data.js. The only values that must also
    change here are in <head>: social crawlers do not execute JavaScript, so the
    title, description, social cards, and JSON-LD cannot be rendered at runtime.
-->
<html lang="en" data-theme="dark">
<head>
<!-- Basic browser and search-engine metadata. Replace these values when reusing. -->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jeet Doshi — Technical Account Manager, automation</title>
<meta name="description" content="Jeet Doshi — Technical Account Manager at WonderBotz. Enterprise automation, UiPath, agentic AI. Writing and talks.">
<!-- Social cards. SITE_URL below must be the absolute deployed origin —
     og:image is ignored by LinkedIn and X if it is a relative path. -->
<link rel="canonical" href="https://jd2091.github.io/">
<meta property="og:type" content="profile">
<meta property="og:url" content="https://jd2091.github.io/">
<meta property="og:site_name" content="Jeet V. Doshi">
<meta property="og:title" content="Jeet Doshi — Technical Account Manager, automation">
<meta property="og:description" content="Jeet Doshi — Technical Account Manager at WonderBotz. Enterprise automation, UiPath, agentic AI. Writing and talks.">
<meta property="og:image" content="https://jd2091.github.io/assets/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Jeet V. Doshi, Technical Account Manager at WonderBotz — I advise enterprises on what I've shipped.">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Jeet Doshi — Technical Account Manager, automation">
<meta name="twitter:description" content="Enterprise automation, UiPath, agentic AI. Writing and talks.">
<meta name="twitter:image" content="https://jd2091.github.io/assets/og.png">

<!-- Authorship. LinkedIn's Post Inspector reads article:author (a plain name);
     name="author" is the generic equivalent other crawlers use. -->
<meta name="author" content="Jeet V. Doshi">
<meta property="article:author" content="Jeet V. Doshi">
<meta property="article:published_time" content="2026-09-14T00:00:00Z">
<meta property="profile:first_name" content="Jeet">
<meta property="profile:last_name" content="Doshi">
<meta property="profile:username" content="jeet-doshi-28408071">

<!-- Structured profile data for search engines. Keep it aligned with PROFILE in
     data.js; crawlers may not execute app.js, so this intentionally lives here. -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Person",
  "name": "Jeet V. Doshi",
  "alternateName": "Jeet Doshi",
  "jobTitle": "Technical Account Manager",
  "worksFor": { "@type": "Organization", "name": "WonderBotz" },
  "url": "https://jd2091.github.io/",
  "image": "https://jd2091.github.io/assets/og.png",
  "address": {
    "@type": "PostalAddress",
    "addressLocality": "Bengaluru",
    "addressRegion": "Karnataka",
    "addressCountry": "IN"
  },
  "knowsAbout": ["Enterprise automation", "UiPath", "Agentic AI", "Azure", "RPA"],
  "sameAs": [
    "https://www.linkedin.com/in/jeet-doshi-28408071",
    "https://github.com/JD2091",
    "https://jdoshi2091.hashnode.dev"
  ]
}
</script>
<!-- Placeholder icon; app.js replaces it with one drawn from
     PROFILE.identity.initials and the current theme colours. -->
<link rel="icon" href="data:,">
<!-- Remote fonts have local fallbacks in styles.css, so the page remains usable
     if Google Fonts is unavailable. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/styles.css">
</head>
<body>

<!-- Every visible string below is supplied by assets/data.js. This file holds
     structure and metadata only — personalising the site means editing data.js.
     The one exception is the <head>: social crawlers do not run JavaScript, so
     the title, social cards, and JSON-LD must stay hardcoded here. -->

<a class="skip" href="#main" id="skipLink"></a>

<div class="shell">

  <!-- On desktop this is a sticky left rail; print CSS turns it into a masthead. -->
  <header class="rail">
    <h1 class="rail__name" id="railName"></h1>
    <p class="rail__role" id="railRole"></p>
    <p class="rail__place" id="railPlace"></p>

    <!-- Nav items are generated from PROFILE.sections, so they cannot drift
         out of step with the sections that actually exist. -->
    <nav class="nav" id="nav"></nav>

    <div class="rail__foot" id="railFoot">
      <div class="rail__links" id="railLinks"></div>
    </div>
  </header>

  <!-- Sections are generated from PROFILE.sections in order. -->
  <main id="main"></main>

</div>

<!-- Load order is a contract: data.js creates window.PROFILE before app.js reads
     it. Both scripts are placed after the markup so rendering can begin at once. -->
<script src="assets/data.js"></script>
<script src="assets/app.js"></script>
</body>
</html>
