<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Resume — Jeet V. Doshi</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2314181C'/%3E%3Ctext x='32' y='43' font-family='Arial,Helvetica,sans-serif' font-size='26' font-weight='700' fill='%23FF7A45' text-anchor='middle'%3EJD%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/resume.css">
</head>
<body>

<div class="bar">
  <a class="bar__back" href="index.html">&larr; Back to the site</a>
  <button class="bar__btn" id="exportPdf" type="button">Export PDF</button>
</div>

<article class="sheet">

  <header class="cv-head">
    <h1 id="rName"></h1>
    <p class="cv-role" id="rRole"></p>
    <p class="cv-contact" id="rContact"></p>
  </header>

  <section class="cv-sec">
    <h2>Profile</h2>
    <p id="rSummary"></p>
  </section>

  <section class="cv-sec">
    <h2>Core skills</h2>
    <dl class="cv-skills" id="rSkills"></dl>
  </section>

  <section class="cv-sec">
    <h2>Experience</h2>
    <div id="rExperience"></div>
  </section>

  <section class="cv-sec cv-sec--split">
    <div>
      <h2>Certifications</h2>
      <ul class="cv-list" id="rCerts"></ul>
    </div>
    <div>
      <h2>Education</h2>
      <ul class="cv-list" id="rEdu"></ul>
    </div>
  </section>

  <section class="cv-sec">
    <h2>Recognition</h2>
    <ul class="cv-list cv-list--awards" id="rAwards"></ul>
  </section>

</article>

<script src="assets/data.js"></script>
<script src="assets/resume.js"></script>
</body>
</html>
